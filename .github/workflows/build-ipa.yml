name: Build unsigned IPA

# 在 GitHub 免费的 macOS 机器上编译出未签名 .ipa。
# 拿到 .ipa 后用爱思助手 / Sideloadly 在 Windows 上用自己的 Apple ID 签名安装。
#
# 用法：
#   1. 把这个仓库推到 GitHub（public 仓库 Actions 免费）
#   2. Actions 页面点 "Build unsigned IPA" → Run workflow
#   3. 跑完后在 Artifacts 里下载 EvDash-unsigned.ipa

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run protocol tests
        run: |
          set -o pipefail
          swift test --parallel

      - name: Build app (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project EvDash.xcodeproj \
            -scheme EvDash \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_BITCODE=NO \
            build

      - name: Package into unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::No .app produced by xcodebuild"
            ls -R build/Build/Products || true
            exit 1
          fi
          echo "App: $APP_PATH"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry EvDash-unsigned.ipa Payload
          ls -lh EvDash-unsigned.ipa
          unzip -l EvDash-unsigned.ipa | head -20

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: EvDash-unsigned-ipa
          path: EvDash-unsigned.ipa
          retention-days: 30
          if-no-files-found: error
