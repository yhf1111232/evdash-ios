name: Build unsigned IPA

# Build an unsigned .ipa on a GitHub-hosted macOS runner.
# After downloading, sign it on Windows with i4Tools / Sideloadly using your Apple ID.
#
# Notes:
#   - macos-13 is the oldest still-supported Intel runner; usually shortest queue.
#   - If it stays queued, change runs-on to macos-14 / macos-15 and retry.
#   - Build is unsigned (CODE_SIGNING_ALLOWED=NO); signing happens on Windows.

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-13
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version
          sw_vers

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run protocol tests
        run: |
          set -o pipefail
          swift test 2>&1 | tail -40

      - name: Build app (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project EvDash.xcodeproj \
            -scheme EvDash \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_BITCODE=NO \
            build 2>&1 | tail -60

      - name: Package into unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::No .app produced by xcodebuild"
            ls -R build/Build/Products || true
            exit 1
          fi
          echo "App: $APP_PATH"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry EvDash-unsigned.ipa Payload
          ls -lh EvDash-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: EvDash-unsigned-ipa
          path: EvDash-unsigned.ipa
          retention-days: 30
          if-no-files-found: error
