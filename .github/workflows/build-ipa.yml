name: Build unsigned IPA

# 鍦?GitHub 鍏嶈垂鐨?macOS 鏈哄櫒涓婄紪璇戝嚭鏈鍚?.ipa銆?# 鎷垮埌 .ipa 鍚庣敤鐖辨€濆姪鎵?/ Sideloadly 鍦?Windows 涓婄敤鑷繁鐨?Apple ID 绛惧悕瀹夎銆?#
# 鐢ㄦ硶锛?#   1. 鎶婅繖涓粨搴撴帹鍒?GitHub锛坧ublic 浠撳簱 Actions 鍏嶈垂锛?#   2. Actions 椤甸潰鐐?"Build unsigned IPA" 鈫?Run workflow
#   3. 璺戝畬鍚庡湪 Artifacts 閲屼笅杞?EvDash-unsigned.ipa

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-13
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run protocol tests
        run: |
          set -o pipefail
          swift test --parallel

      - name: Build app (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project EvDash.xcodeproj \
            -scheme EvDash \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_BITCODE=NO \
            build

      - name: Package into unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::No .app produced by xcodebuild"
            ls -R build/Build/Products || true
            exit 1
          fi
          echo "App: $APP_PATH"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry EvDash-unsigned.ipa Payload
          ls -lh EvDash-unsigned.ipa
          unzip -l EvDash-unsigned.ipa | head -20

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: EvDash-unsigned-ipa
          path: EvDash-unsigned.ipa
          retention-days: 30
          if-no-files-found: error
